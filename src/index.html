<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title and Description Tags -->
    <title>Tybo Fashion - Discover Unique Fashion in South Africa</title>
    <meta
      name="description"
      content="Discover unique styles on Tybo Fashion, connecting you with talented fashion designers. Explore ready-to-wear masterpieces and personalized designs tailored just for you."
    />
    <meta
      name="keywords"
      content="Tybo Fashion, fashion, designers, ready-to-wear, custom designs, unique styles"
    />
    <meta name="author" content="Tybo Solutions Team" />
    <!-- Canonical Tag -->
    <link rel="canonical" href="https://www.tybofashion.com" />

    <meta
      property="og:image"
      content="https://tybofashion.co.za/og-image.jpg"
    />
    <meta property="og:url" content="https://tybofashion.co.za/page-url" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tybofashion" />
    <meta name="twitter:title" content="Tybo Fashion" />

    <meta
      name="twitter:image"
      content="https://tybofashion.co.za/twitter-card-image.jpg"
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Above-the-fold hero: load early, do not lazy-load -->
    <link
      rel="preload"
      as="image"
      href="assets/images/tui/hero-tybo-fashion.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#1976d2" />
  </head>

      >Please enable JavaScript to continue using this application.</noscript
    >
  </body>
</html>
