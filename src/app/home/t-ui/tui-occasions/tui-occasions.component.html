<section class="occasions" *ngIf="occasions.length">
  <div class="container">
    <header class="occasions__header">
      <div>
        <h2 class="occasions__title">Shop by occasion</h2>
        <p class="occasions__subtitle">
          Real pieces made for life's biggest moments.
        </p>
      </div>
      <a routerLink="/home/occasions" class="occasions__link">
        View all occasions
        <i class="bi bi-arrow-right"></i>
      </a>
    </header>

    <div class="occasions__rail">
      <a
        *ngFor="let occasion of occasions"
        [routerLink]="occasion.Link"
        class="occasion"
      >
        <span class="occasion__media">
          <img
            [src]="occasion.ImageUrl"
            [alt]="occasion.Name"
            loading="lazy"
            (error)="onImageError($event)"
          />
        </span>
        <span class="occasion__name">{{ occasion.Name }}</span>
      </a>
    </div>
  </div>
</section>
