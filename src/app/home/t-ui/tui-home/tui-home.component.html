<!-- This navigation component is under construction and will be replaced with a new design soon. -->
<!-- <app-navigation /> -->
<app-tui-nav />
<main class="main p-0">
  <!-- Editorial hero -->
  <section class="hero">
    <div class="hero__media">
      <picture>
        <source
          srcset="assets/images/tui/hero-tybo-fashion.webp"
          type="image/webp"
        />
        <img
          src="assets/images/tui/hero-tybo-fashion.png"
          alt="Tybo Fashion — African designers' ready-to-wear and made-to-order pieces"
          fetchpriority="high"
        />
      </picture>
      <div class="hero__scrim"></div>
    </div>

    <div class="container hero__content">
      <p class="hero__eyebrow">South African Designers</p>
      <h1 class="hero__title">Made in Africa.<br />Made for the moment.</h1>
      <p class="hero__subtitle">
        Discover ready-to-wear and made-to-order fashion from independent South
        African designers.
      </p>
      <div class="hero__actions">
        <a routerLink="/home/products" class="btn btn-warning btn-lg text-dark">
          <i class="bi bi-bag me-2"></i> Shop New In
        </a>
        <a routerLink="/home/shops" class="btn btn-outline-light btn-lg">
          <i class="bi bi-stars me-2"></i> Explore Designers
        </a>
      </div>
    </div>
  </section>

  <!-- New in Tybo -->
  <app-tui-new-in [products]="products" [count]="8" />

  <!-- Shop by occasion (cross-designer, from the occasion index) -->
  <app-tui-occasions />

  <!-- Featured designer -->
  <app-tui-featured-designer
    [company]="featuredDesigner"
    [products]="products"
  />

  <!-- Made for real moments (portfolio inspiration) -->
  <app-tui-moments [items]="galleryItems" [limit]="6" />

  <!-- Trust strip -->
  <app-tui-trust-strip />

  <!-- Sell on Tybo (designer pitch, full story on /sell) -->
  <app-tui-sell-cta />

  <app-footer />
</main>
