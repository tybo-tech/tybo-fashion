<section class="nav-section">
  <div class="box">
    <app-tui-nav [showBack]="true" />
  </div>
</section>

<main class="main p-0">
  <header class="shops-header">
    <div class="container">
      <p class="shops-header__eyebrow">Tybo Fashion</p>
      <h1 class="shops-header__title">Explore Designers</h1>
      <p class="shops-header__subtitle">
        Discover independent South African designers and their latest pieces.
      </p>
    </div>
  </header>

  <div class="container shops-body">
    <div class="shops-grid" *ngIf="shops?.length">
      <a class="shop" [routerLink]="['/', shop.Slug]" *ngFor="let shop of shops">
        <img
          [src]="shop.Dp || 'assets/images/placeholder.svg'"
          [alt]="shop.Name"
          loading="lazy"
          (error)="onImageError($event)"
        />
        <h5 class="shop__name">{{ shop.Name }}</h5>
        <span class="shop__link">Visit shop</span>
      </a>
    </div>

    <p class="shops-empty" *ngIf="!loaded">Loading designers…</p>
    <p class="shops-empty" *ngIf="loaded && !shops?.length">
      No designers are live just yet. Check back soon.
    </p>
  </div>
</main>

<app-footer />
