<div *ngIf="job">
  <div class="d-flex align-items-center justify-content-between mb-2">
    <div class="d-flex gap-2 small">
      <span *ngIf="hasItems" class="badge bg-light text-dark border">{{ totalItems }} item{{ totalItems !== 1 ? 's' : '' }}</span>
      <span *ngIf="hasItems" class="badge bg-light text-dark border">{{ totalQuantity }} qty</span>
    </div>
    <button class="btn btn-primary btn-sm d-inline-flex align-items-center gap-1" (click)="addItem()">
      <i class="bi bi-plus-lg"></i> Add item
    </button>
  </div>

  <!-- Sprint 5 §4 — plain list, no section box, no row cards. The list
       carries an explicit top separator; each row a bottom border
       (between-row and bottom separators). -->
  <div *ngIf="hasItems" class="d-flex flex-column item-list">
    <app-job-item *ngFor="let item of jobItems" [jobItem]="item" [user]="user" [job]="job"></app-job-item>
  </div>

  <!-- Empty state -->
  <div *ngIf="!hasItems" class="text-center py-4">
    <div class="mx-auto d-inline-flex align-items-center justify-content-center rounded-circle bg-light border mb-2 icon-40"><i class="bi bi-bag"></i></div>
    <h6 class="mb-1">No items yet</h6>
    <p class="small text-muted mb-3">Add items to this job.</p>
    <button class="btn btn-primary btn-sm" (click)="addItem()"><i class="bi bi-plus-lg me-1"></i> Add item</button>
  </div>
</div>
