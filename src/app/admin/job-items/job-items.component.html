<div *ngIf="job">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div class="d-flex gap-2 small">
      <span *ngIf="hasItems" class="badge bg-light text-dark border">{{ totalItems }} item{{ totalItems !== 1 ? 's' : '' }}</span>
      <span *ngIf="hasItems" class="badge bg-light text-dark border">{{ totalQuantity }} qty</span>
    </div>
    <button *ngIf="!addMode" class="btn btn-primary btn-sm d-inline-flex align-items-center gap-1" [disabled]="isLoading" (click)="toggleAddMode()">
      <i class="bi bi-plus-lg"></i> Add item
    </button>
  </div>

  <div *ngIf="hasItems" class="d-flex flex-column gap-3">
    <div *ngFor="let item of jobItems" class="border rounded-3 bg-white">
      <app-job-item [jobItem]="item" [user]="user" [job]="job"></app-job-item>
    </div>
  </div>

  <div *ngIf="!hasItems && !addMode" class="text-center py-4 border rounded-3 bg-light">
    <div class="mx-auto d-inline-flex align-items-center justify-content-center rounded-circle bg-white border mb-2 icon-40"><i class="bi bi-bag"></i></div>
    <h6 class="mb-1">No items yet</h6>
    <p class="small text-muted mb-3">Add garments to this job.</p>
    <button class="btn btn-primary btn-sm" [disabled]="isLoading" (click)="toggleAddMode()"><i class="bi bi-plus-lg me-1"></i> Add first item</button>
  </div>

  <div *ngIf="addMode" class="mt-3">
    <app-job-item-form [user]="user" [jobItem]="jobItem" (onClose)="addMode = false" (jobItemUpdated)="onJobItemUpdated($event)"></app-job-item-form>
  </div>
</div>
