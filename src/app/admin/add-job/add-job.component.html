<div class="app-overlay" *ngIf="job">
  <div class="my-modal cloud full-height">
    <app-admin-modal-header (onClose)="onClose.emit()" title="Add job" />
    <div class="actions">
      <h3>Select or add a customer</h3>
      <app-customer-list-view
        (onSelect)="selected($event)"
        (onAdd)="selected($event)"
        [busy]="creatingJob"
      />
      <!-- Visible busy state while a job is being created -->
      <div *ngIf="creatingJob" class="creating-job d-flex align-items-center gap-2 text-muted small mt-2">
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        <span>Creating job…</span>
      </div>
    </div>
  </div>
</div>
