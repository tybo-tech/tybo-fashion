<div class="measurements-editor">
  <div *ngIf="measurements.length" class="card border bg-white">
    <div class="card-body p-3">
      <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
        <label class="form-label small text-muted mb-0">Units</label>
        <select
          [(ngModel)]="units"
          name="measurement-units"
          id="measurement-units"
          class="form-select form-select-sm w-auto"
          (change)="onUnits(); onDone()"
        >
          <option [value]="u" *ngFor="let u of systemUnits">
            {{ u || 'Select Units' }}
          </option>
        </select>
      </div>
      <small class="text-danger d-block mb-2" *ngIf="unit_error">
        {{ unit_error }}
      </small>

      <div class="measurement-rows">
        <div class="measurement-row" *ngFor="let item of measurements; let i = index">
          <input
            [ngModelOptions]="{ standalone: true }"
            type="text"
            class="form-control form-control-sm"
            [id]="'measurement-name-' + i"
            [(ngModel)]="item.Name"
            [readOnly]="!can_edit"
            placeholder="Measurement name"
            required
            (change)="onDone()"
          />
          <input
            [ngModelOptions]="{ standalone: true }"
            type="number"
            class="form-control form-control-sm"
            [id]="'measurement-value-' + i"
            [(ngModel)]="item.Value"
            placeholder="Value"
            required
            (change)="onDone()"
          />
          <button
            *ngIf="can_delete"
            type="button"
            class="btn btn-sm btn-outline-danger measurement-delete"
            (click)="delete(i)"
            [attr.aria-label]="'Remove ' + (item.Name || 'measurement')"
          >
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
      <small class="text-danger d-block mt-2" *ngIf="values_error">
        {{ values_error }}
      </small>

      <div class="d-flex justify-content-end mt-3" *ngIf="can_add">
        <button type="button" class="btn btn-sm btn-outline-primary" (click)="add_measurement()">
          <i class="bi bi-plus-lg me-1"></i> Add Line
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="!measurements.length" class="text-center py-4">
    <div class="mx-auto d-inline-flex align-items-center justify-content-center rounded-circle bg-light border mb-2 icon-40">
      <i class="bi bi-rulers text-muted"></i>
    </div>
    <p class="small text-muted mb-3">No measurements added yet.</p>
    <button type="button" class="btn btn-sm btn-outline-primary" (click)="add_measurement()">
      <i class="bi bi-plus-lg me-1"></i> Add Measurement
    </button>
  </div>
</div>

<app-system-measurements
  mode="view"
  *ngIf="show_picker"
  (closed)="show_picker = false"
  (doneSelecting)="doneSelectingFromSystem($event)"
/>
