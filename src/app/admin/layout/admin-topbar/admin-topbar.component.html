<header class="admin-topbar border-bottom bg-white sticky-top">
  <div class="container-fluid px-3 px-lg-4 py-2 d-flex align-items-center justify-content-between gap-2">
    <div class="d-flex align-items-center gap-2 flex-shrink-1 min-w-0">
      <a class="d-flex align-items-center gap-2 text-decoration-none text-dark" routerLink="/store/admin">
        <span class="d-inline-flex align-items-center justify-content-center rounded-2 text-white flex-shrink-0 icon-32 bg-admin-primary">
          <i class="bi bi-shop"></i>
        </span>
        <span class="d-flex flex-column min-w-0">
          <span class="fw-semibold text-truncate fs-95 lh-1">{{ company?.Name }}</span>
          <small class="text-muted fs-7">Admin</small>
        </span>
      </a>
    </div>

    <div class="d-flex align-items-center gap-2">
      <a class="btn btn-sm btn-outline-secondary d-none d-md-inline-flex align-items-center gap-1" [href]="storeUrl">
        <i class="bi bi-box-arrow-up-right"></i> Store
      </a>
      <button class="btn btn-sm btn-outline-secondary d-none d-lg-inline-flex" type="button" (click)="logout.emit()">
        <i class="bi bi-box-arrow-right me-1"></i> Logout
      </button>
    </div>
  </div>
</header>
