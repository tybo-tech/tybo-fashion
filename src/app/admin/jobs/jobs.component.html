<div class="jobs-screen">
  <!-- Sticky toolbar: title + actions + filters. Pins under the admin
       topbar; the list scrolls beneath it. -->
  <div class="jobs-toolbar">
    <div class="d-flex align-items-center justify-content-between gap-2 px-3 px-md-0 pt-3 pt-md-0 pb-2">
      <h1 class="h5 mb-0">Jobs</h1>
      <button class="btn btn-primary btn-sm d-inline-flex align-items-center gap-1" (click)="openAddJob()">
        <i class="bi bi-plus-lg"></i> New Job
      </button>
    </div>

    <!-- Search & filter -->
    <div class="d-flex align-items-center gap-2 px-3 px-md-0 pb-2">
      <app-search-input
        class="flex-fill"
        [value]="query"
        (valueChange)="query = $event"
        (search)="onSearch($event)"
        placeholder="Search job number or customer…"
      ></app-search-input>
      <select class="form-select form-select-sm w-auto flex-shrink-0" [(ngModel)]="selectedStatus" (change)="onStatusChange()" aria-label="Filter by status">
        <option value="">All statuses</option>
        <option value="not-started">Not started</option>
        <option value="in-progress">In Progress</option>
        <option value="completed">Completed</option>
        <option value="stuck">Stuck</option>
        <option value="terminated">Terminated</option>
        <option value="paused">Paused</option>
      </select>
      <button class="btn btn-outline-secondary btn-sm flex-shrink-0" type="button" *ngIf="query || selectedStatus" (click)="resetFilters()">Reset</button>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border spinner-border-sm"></div>
    <div class="small text-muted mt-2">Loading jobs…</div>
  </div>
  <div *ngIf="error && !loading" class="alert alert-danger py-2 small" role="alert">
    <div>{{ error }}</div>
    <button class="btn btn-outline-secondary btn-sm mt-2" type="button" (click)="retry()">Retry</button>
  </div>

  <!-- Jobs list: unboxed on mobile, same structure on desktop -->
  <div *ngIf="!loading && !error && jobs.length > 0">
    <ul class="list-group list-group-flush jobs-list">
      <li *ngFor="let job of jobs; trackBy: trackByJobId" class="list-group-item jobs-list-item">
        <app-job-list-card
          [jobNo]="job.JobNo"
          [customerName]="job.CustomerName"
          [status]="job.Status"
          [startDate]="job.StartDate"
          [dueDate]="job.DueDate"
          [link]="'/store/admin/job/' + job.JobId + '/jobs'"
        ></app-job-list-card>
      </li>
    </ul>

    <!-- Pagination: driven by API metadata -->
    <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2 mt-2 px-3 px-md-0">
      <span class="small text-muted">Showing {{ pageStart }}–{{ pageEnd }} of {{ pagination.totalItems }}</span>
      <nav class="d-flex align-items-center gap-1" aria-label="Jobs pagination">
        <button class="btn btn-sm btn-outline-secondary" (click)="prevPage()" [disabled]="!pagination.hasPrevious" aria-label="Previous page"><i class="bi bi-chevron-left"></i></button>
        <span class="small text-muted px-1">Page {{ pagination.page }} of {{ totalPages }}</span>
        <button class="btn btn-sm btn-outline-secondary" (click)="nextPage()" [disabled]="!pagination.hasNext" aria-label="Next page"><i class="bi bi-chevron-right"></i></button>
      </nav>
    </div>
  </div>

  <!-- Empty state: distinguish no-jobs-at-all, filtered-empty, and page-beyond-end -->
  <div *ngIf="!loading && !error && jobs.length === 0" class="text-center py-5">
    <div class="mx-auto d-inline-flex align-items-center justify-content-center rounded-circle bg-light border mb-3 icon-48"><i class="bi bi-briefcase"></i></div>
    <h6 class="mb-1">{{ emptyStateTitle }}</h6>
    <p class="small text-muted mb-3">{{ emptyStateHint }}</p>
    <button class="btn btn-primary btn-sm" (click)="emptyStateAction()">{{ emptyStateActionLabel }}</button>
  </div>
</div>

<app-add-job *ngIf="show_add" (onClose)="closeAddJob()" [preselectedCustomer]="preselectedCustomer"></app-add-job>
