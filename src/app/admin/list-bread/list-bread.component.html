<nav aria-label="breadcrumb" class="mb-2">
  <ol class="breadcrumb small mb-2">
    <li class="breadcrumb-item"><a routerLink="/store/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Dashboard</a></li>
    <li class="breadcrumb-item" *ngIf="prevPage && prevLink"><a [routerLink]="prevLink">{{ prevPage }}</a></li>
    <li class="breadcrumb-item active" aria-current="page">{{ currentPage }}</li>
  </ol>
</nav>
<div class="d-flex align-items-center gap-2 mb-3 d-md-none">
  <a class="btn btn-sm btn-light border" [routerLink]="prevLink || '/store/admin/'" aria-label="Back"><i class="bi bi-arrow-left"></i></a>
  <span class="fw-semibold small">{{ currentPage }}</span>
  <button *ngIf="showDelete" class="btn btn-sm btn-outline-danger ms-auto" (click)="onDelete.emit()" aria-label="Delete"><i class="bi bi-trash"></i></button>
</div>
<div class="d-none d-md-flex justify-content-end mb-2" *ngIf="showDelete">
  <button class="btn btn-sm btn-outline-danger" (click)="onDelete.emit()"><i class="bi bi-trash me-1"></i> Delete</button>
</div>
