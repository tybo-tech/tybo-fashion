<div class="_overlay" *ngIf="job">
  <div class="_modal">
    <app-admin-modal-header title="Payment history" (onClose)="onClose.emit()"></app-admin-modal-header>
    <div class="_body p-3">
      <div *ngIf="job.Metadata.payments?.length" class="table-responsive">
        <table class="table table-sm align-middle mb-3">
          <thead><tr><th class="small text-muted">Amount</th><th class="small text-muted">Date</th></tr></thead>
          <tbody>
            <tr *ngFor="let item of job.Metadata.payments">
              <td class="small fw-medium">{{ item.Amount | currency:'ZAR':'symbol':'1.2-2' }}</td>
              <td class="small text-muted">{{ item.Date | date:'mediumDate' }}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div *ngIf="!job.Metadata.payments?.length" class="text-center py-3 border rounded-2 bg-light mb-3 small text-muted">No payments recorded yet.</div>
      <div class="d-flex justify-content-end">
        <button class="btn btn-primary btn-sm" (click)="add()"><i class="bi bi-plus-lg me-1"></i> Add payment</button>
      </div>
    </div>
  </div>
</div>

<div class="_overlay" *ngIf="show_add">
  <div class="_modal">
    <app-admin-modal-header title="Capture payment" (onClose)="show_add = false"></app-admin-modal-header>
    <div class="_body p-3">
      <label class="form-label small text-muted" for="pay-amount">Amount (ZAR)</label>
      <input id="pay-amount" type="number" class="form-control mb-3" [(ngModel)]="amount" placeholder="0.00" min="0" step="0.01">
      <div class="d-flex gap-2 justify-content-end">
        <button class="btn btn-outline-secondary btn-sm" (click)="show_add = false">Cancel</button>
        <button class="btn btn-primary btn-sm" [disabled]="!amount" (click)="done_add()">Confirm {{ amount ? (amount | currency:'ZAR':'symbol':'1.2-2') : '' }}</button>
      </div>
    </div>
  </div>
</div>
