<!-- Lean, paginated customer picker (Sprint 3) -->
<div class="picker-container">
  <!-- Search + persistent New Customer action -->
  <div class="d-flex align-items-center gap-2 mb-2">
    <app-search-input
      class="flex-fill"
      [value]="query"
      (valueChange)="query = $event"
      (search)="onSearch($event)"
      placeholder="Search name, phone or email…"
      [disabled]="busy"
    ></app-search-input>
    <button class="btn btn-primary btn-sm flex-shrink-0" type="button" *ngIf="allowAdd" (click)="openNewCustomer()" [disabled]="busy">
      <i class="bi bi-plus-lg"></i> New Customer
    </button>
    <button class="btn btn-outline-secondary btn-sm flex-shrink-0" type="button" *ngIf="query" (click)="resetSearch()" [disabled]="busy">Reset</button>
  </div>

  <div *ngIf="loading" class="text-center py-4">
    <div class="spinner-border spinner-border-sm"></div>
    <div class="small text-muted mt-2">Loading customers…</div>
  </div>
  <div *ngIf="error && !loading" class="alert alert-danger py-2 small" role="alert">
    <div>{{ error }}</div>
    <button class="btn btn-outline-secondary btn-sm mt-2" type="button" (click)="retry()">Retry</button>
  </div>

  <!-- Compact rows: name, phone, email only -->
  <div *ngIf="!loading && !error && customers.length > 0">
    <ul class="list-group list-group-flush picker-list">
      <li *ngFor="let customer of customers; trackBy: trackByCustomerId" class="list-group-item picker-list-item">
        <button type="button" class="picker-row" (click)="onSelect.emit(customer)" [disabled]="busy" [attr.aria-label]="'Select customer ' + customer.CustomerName">
          <span class="picker-row-main min-w-0">
            <span class="picker-name text-truncate">{{ customer.CustomerName }}</span>
            <span class="picker-contact text-truncate">
              <span *ngIf="customer.PhoneNumber !== '—'">{{ customer.PhoneNumber }}</span>
              <span *ngIf="customer.PhoneNumber !== '—' && customer.Email !== '—'" class="contact-sep">·</span>
              <span *ngIf="customer.Email !== '—'">{{ customer.Email }}</span>
            </span>
          </span>
          <span class="picker-row-side flex-shrink-0">
            <i class="bi bi-chevron-right text-muted small"></i>
          </span>
        </button>
      </li>
    </ul>

    <!-- Pagination: driven by API metadata -->
    <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2 mt-2 px-1">
      <span class="small text-muted">Showing {{ pageStart }}–{{ pageEnd }} of {{ pagination.totalItems }}</span>
      <nav class="d-flex align-items-center gap-1" aria-label="Customers pagination">
        <button class="btn btn-sm btn-outline-secondary" (click)="prevPage()" [disabled]="!pagination.hasPrevious || busy" aria-label="Previous page"><i class="bi bi-chevron-left"></i></button>
        <span class="small text-muted px-1">Page {{ pagination.page }} of {{ totalPages }}</span>
        <button class="btn btn-sm btn-outline-secondary" (click)="nextPage()" [disabled]="!pagination.hasNext || busy" aria-label="Next page"><i class="bi bi-chevron-right"></i></button>
      </nav>
    </div>
  </div>

  <!-- Empty state -->
  <div *ngIf="!loading && !error && customers.length === 0" class="text-center py-4">
    <div class="mx-auto d-inline-flex align-items-center justify-content-center rounded-circle bg-light border mb-3 icon-48"><i class="bi bi-people"></i></div>
    <h6 class="mb-1">{{ emptyStateTitle }}</h6>
    <p class="small text-muted mb-3">{{ emptyStateHint }}</p>
    <button *ngIf="emptyStateHasAction" class="btn btn-primary btn-sm" (click)="emptyStateAction()">{{ emptyStateActionLabel }}</button>
  </div>
</div>
