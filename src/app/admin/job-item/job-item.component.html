<!-- Sprint 5 §4 — plain garment row. The whole row is one clickable,
     keyboard-focusable target (native anchor). No qty stepper, no inline
     delete: editing and removal live on the garment details page. -->
<a *ngIf="jobItem && job" class="garment-row text-decoration-none" [routerLink]="garmentLink">
  <span class="garment-thumb flex-shrink-0">
    <img *ngIf="featuredImageUrl" [src]="featuredImageUrl" [alt]="itemName" class="w-100 h-100 object-fit-cover rounded-2 border">
    <span *ngIf="!featuredImageUrl" class="w-100 h-100 d-flex align-items-center justify-content-center rounded-2 border bg-light"><i class="bi bi-image text-muted"></i></span>
  </span>

  <span class="flex-grow-1 min-w-0 d-flex flex-column gap-1">
    <span class="fw-semibold text-dark text-truncate">{{ itemName }}</span>
    <span class="small text-muted text-truncate">{{ itemSize }}<ng-container *ngIf="itemColour"> · {{ itemColour }}</ng-container> · Qty {{ itemQuantity }}</span>
    <span *ngIf="assignedTo" class="small text-muted d-flex align-items-center gap-1"><i class="bi bi-person-circle"></i> {{ assignedTo | userPipe }}</span>
  </span>

  <span class="flex-shrink-0 d-flex align-items-center gap-2">
    <span class="fw-semibold small text-success">{{ itemTotal | currency:'ZAR':'symbol':'1.2-2' }}</span>
    <i class="bi bi-chevron-right text-muted small" aria-hidden="true"></i>
  </span>
</a>
