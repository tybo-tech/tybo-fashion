<div class="p-3 d-flex gap-3" *ngIf="jobItem && job">
  <button type="button" class="border-0 bg-transparent p-0 flex-shrink-0 thumb-96" (click)="editItem()" [attr.aria-label]="'Edit ' + itemName">
    <img *ngIf="featuredImageUrl" [src]="featuredImageUrl" [alt]="itemName" class="w-100 h-100 object-fit-cover rounded-2 border">
    <span *ngIf="!featuredImageUrl" class="w-100 h-100 d-flex align-items-center justify-content-center rounded-2 border bg-light"><i class="bi bi-image text-muted"></i></span>
  </button>
  <div class="flex-grow-1 d-flex flex-column gap-1 min-w-0">
    <div class="d-flex justify-content-between gap-2">
      <button type="button" class="btn btn-link p-0 text-start fw-semibold text-dark text-truncate" (click)="editItem()">{{ itemName }}</button>
      <span class="fw-semibold small text-success flex-shrink-0">{{ itemTotal | currency:'ZAR':'symbol':'1.2-2' }}</span>
    </div>
    <div *ngIf="assignedTo" class="small text-muted d-flex align-items-center gap-1"><i class="bi bi-person-circle"></i> {{ assignedTo | userPipe }}</div>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-light text-dark border small"><i class="bi bi-rulers me-1"></i>{{ itemSize }}</span>
    </div>
    <div class="d-flex align-items-center justify-content-between gap-2 mt-1">
      <app-admin-qty [qty]="itemQuantity" (qtyChange)="update_qty($event, jobItem)"></app-admin-qty>
      <button (click)="delete_from_cart(jobItem)" class="btn btn-sm btn-outline-danger" [attr.aria-label]="'Remove ' + itemName"><i class="bi bi-trash3"></i></button>
    </div>
  </div>
</div>
