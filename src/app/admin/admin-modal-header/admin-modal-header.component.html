<div class="d-flex align-items-center justify-content-between border-bottom p-3 bg-white">
  <h6 class="mb-0 small fw-semibold">{{ title }}</h6>
  <button type="button" class="btn btn-sm btn-light border" (click)="onClose.emit()" [attr.aria-label]="'Close ' + title">
    <i class="bi" [ngClass]="show_x ? 'bi-x-lg' : 'bi-arrow-left'"></i>
  </button>
</div>
