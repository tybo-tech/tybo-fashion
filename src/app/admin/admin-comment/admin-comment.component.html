<div>
  <h6 class="small text-muted mb-2">{{ title }}</h6>
  <div *ngFor="let comment of comments" class="card border mb-2">
    <div class="card-body p-3">
      <div class="d-flex align-items-center gap-2 mb-2">
        <img *ngIf="comment.userImage" [src]="comment.userImage" [alt]="comment.userDisplayName" class="rounded-circle" style="width:28px;height:28px;object-fit:cover">
        <span class="small fw-semibold">{{ comment.userDisplayName }}</span>
        <span class="small text-muted ms-auto">{{ comment.date }}</span>
        <div class="dropdown">
          <button class="btn btn-sm btn-light border py-1 px-2" type="button" data-bs-toggle="dropdown" aria-label="Comment actions"><i class="bi bi-three-dots"></i></button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><button class="dropdown-item small" (click)="editComment(comment)">Edit</button></li>
            <li><button class="dropdown-item small text-danger" (click)="deleteComment(comment)">Delete</button></li>
          </ul>
        </div>
      </div>
      <div *ngIf="editingComment !== comment" class="small">{{ comment.comment }}</div>
      <div *ngIf="editingComment === comment" class="d-flex flex-column gap-2">
        <textarea [(ngModel)]="editingComment.comment" class="form-control form-control-sm" rows="3"></textarea>
        <button class="btn btn-primary btn-sm align-self-start" (click)="saveEditComment(comment)">Save</button>
      </div>
      <img *ngIf="comment.attachment" [src]="comment.attachment" alt="attachment" class="img-fluid rounded-2 border mt-2" style="max-height:240px">
    </div>
  </div>
  <div class="card border bg-light">
    <div class="card-body p-3">
      <label class="form-label small text-muted" for="new-comment">Add comment</label>
      <textarea id="new-comment" class="form-control form-control-sm mb-2" [(ngModel)]="comment" rows="3" placeholder="Special instructions…"></textarea>
      <div class="d-flex gap-2 align-items-center flex-wrap">
        <button class="btn btn-primary btn-sm" [disabled]="!comment" (click)="addComment()">Add comment</button>
        <button class="btn btn-outline-secondary btn-sm" type="button" (click)="show_attachment = true">
          <i class="bi bi-camera me-1"></i> {{ attachment ? 'Change image' : 'Attach image' }}
        </button>
        <span *ngIf="attachment" class="small text-success"><i class="bi bi-check-lg"></i> Image attached</span>
      </div>
    </div>
  </div>
  <div class="_overlay" *ngIf="show_attachment">
    <div class="_modal">
      <div class="_header">
        <h2 class="h6 mb-0">Attach image</h2>
        <button class="btn btn-sm btn-light" (click)="show_attachment = false" aria-label="Close"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="_body p-3">
        <app-image-widget [image_url]="attachment" (imageChangedEvent)="image_changed($event)"></app-image-widget>
      </div>
    </div>
  </div>
</div>
