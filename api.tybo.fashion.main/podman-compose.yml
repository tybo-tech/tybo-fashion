version: '3.8'

services:
  php:
    build: .
    container_name: tybo_fashion_main
    volumes:
      - ./:/var/www/html
    ports:
      - "8080:80"
    environment:
      - ACCEPT_EULA=Y

  mysql:
    image: mysql:8.0
    container_name: tybo_fashion_main-container
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: tybo_fashion
      MYSQL_USER: docker
      MYSQL_PASSWORD: docker
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: tybo_fashion_main-phpmyadmin-container
    environment:
      PMA_HOST: mysql  # Use correct MySQL service name
      MYSQL_ROOT_PASSWORD: root_password
      UPLOAD_LIMIT: 1G
      MEMORY_LIMIT: 1G
      MAX_EXECUTION_TIME: 3000
    ports:
      - "8081:80"  # Changed port mapping to avoid conflict
    volumes:
      - ./custom.ini:/usr/local/etc/php/conf.d/custom.ini

volumes:
  mysql_data:
